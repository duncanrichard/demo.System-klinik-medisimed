{% extends "layout/master.html" %}
{% block title %}
Proses Akhir Bulan Stock ---------------> Data Farmasi
{% endblock %}
{% block content %}

<div class=''>
    <div class="wrapper wrapper-content entry">
        <div class="row">
            <div class="col-lg-12"  style="padding-top: 16px;">
                <div class="ibox">
                    <div class="ibox-title" style="box-shadow: 10px 10px 5px 0 rgba(0, 0, 0, .75)">
                        <h3 style="text-align: center">Proses Akhir Bulan Stock</h3>
                    </div>
                    <div class="ibox-content">
                        <div class='row'>
                            <div class="col-md-6 offset-md-3" style="padding-top: 16px;">
                                <div class="form-row">
                                    <label class="col-md-2 control-label">Tanggal Proses </label>
                                    <div class="col-md-3" >
                                        <input id="tanggal" type="date" class="form-control input-sm today" style="font-size: 15px;height: 35px;">
                                    </div>
                                    <input type="hidden" id="paramproses">
                                </div>
                            </div>
                            
                        </div>
                        <div class="row">
                            <div class="col-md-6 offset-md-3">
                                <button class="btn btn-primary  btn-lg active" id="Prosesakhir">
                                    <span class="fa fa-save"></span> Proses
                                </button>
                                <button class="btn btn-default btn-lg active" id="Batalproses" data-dismiss="modal">
                                    <span class="fa fa-recycle"></span> Batal
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}

{% block script %}
{% load static %}
<script type="text/javascript">
{% include 'farmasi/proses_datastock/js/init.html' %} 
</script>
{% endblock  %}
