{% load staticfiles %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>EMR SIMKLINIK</title>
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" />
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/plugins/select2/select2.min.css' %}">
</head>

<body class="pace-done">
    <div class="container h-100">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-md-4">
                <div class="ibox-content">
                    <h1 class="text-center font-bold"><img src="/static/img/logo_emr.png" height="30px"/> EMR-KLINIK</h1>
                    {% if invalid %}
                    <div class="alert alert-danger alert-dismissable">
                        <button aria-hidden="true" data-dismiss="alert" class="close" type="button">×</button>
                        {{ message }}
                    </div>
                    {% endif %}
                    
                        <!-- <div class="form-group">

                            <label for="" style="color: #000;"><strong>KLINIK</strong></label><br/>
                            <select class="form-control select2" id="klinikEMR" name="klinikEMR">
                                <option value="-">- cari klinik -</option>
                            </select>
                          
                        </div>
                        <div class="form-group">
                            <label for="" style="color: #000;"><strong>USER</strong></label><br/>
                            <select class="form-control select2" id="userEMR" name="userEMR">
                                <option value="-">- cari user -</option>
                            </select>
                            
                        </div> -->
                    <form action="{% url 'emrj_login' %}" method="POST" class="m-t">
                        {% csrf_token %}
                        <div class="form-group">
                            <input type="text" class="form-control" name="username" placeholder="Username" required="">
                        </div>

                        <!-- <input type="hidden" class="form-control" name="cabang" id="cabang" placeholder="" required="">
                        <input type="hidden" class="form-control" name="username" id="username" placeholder="Username" required=""> -->
                        <div class="form-group">
                            <input type="password" class="form-control" name="password" placeholder="Password" required="">
                        </div>
                        <button type="submit" class="btn btn-primary block full-width m-b">Masuk</button>
                    </form>
                    <p class="mt-4 text-center">
                        <small>Dikembangkan Oleh <a href="https://medisimed.com" target="_blank">Medisimed</a> &copy; {% now "Y" %}</small>
                    </p>
                </div>
            </div>
        </div>
    </div>

   
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/plugins/select2/select2.full.min.js'%}"></script>
    <script src="{% static 'js/emr/app.js' %}"></script>
</body>
</html>
