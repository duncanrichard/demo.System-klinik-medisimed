    function loadContentTransaksi(elm){
        var jns = $(elm).data('jenis');
        var no_trans = $(elm).attr('id').split("_")[2];
        
        $.ajax({
            // url : "/emr/riwayat-cppt/detail",
            url: host + "/getRiwayatPemeriksaanByNORMDetail",
            method : 'get',
            data : {
                'jenis' :jns,
                'no_transaksi' : no_trans,
            },
            success : function(dt){
   
                /*IGD*/
                if(jns == 'CPPT_DR')
                {
                    renderContentCPTD(elm,dt);
                }else if (jns == 'CPPT_PRW')
                {
                    renderContentCPTP(elm,dt);
                }
            }
        })

    }


    function renderContentCPTD(elm, data)
    {
            
        var dt = data[0];
        var dom = '';
        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> Waktu Pemeriksaan </b></div>'
        dom += '<div class="col-md-8">: '+dt.TTVUPDATED_ATS+'</div></div></div>';
        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> Keluhan Utama </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTD_KELUHANUTAMA+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> R/Skrng </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTD_RIWAYAT_SKG+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> S </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTD_S+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> O </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTD_O.replace(/; /g, "<br/>")+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> A </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTD_A.replace(/; /g, "<br/>")+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> P </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTD_P+'</div></div></div>';
       
        dom += '<div class="col-md-12" style="margin: 7px 0 ;"><div class="row"><div class="col-md-4"><b> Resep </b></div>'
        dom += '<div class="col-md-8"><span style="float:left;position:relative">:</span>'
        dom += '<div class="col-md-10" style="margin-left:0px;font-size:12px;"><div id="riwayat_farmasi_'+dt.CPTDNO_TRANSAKSI_RJ+'"></div></div></div></div></div>';

        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> Petugas </b></div>';

       
        dom += '<div class="col-md-8">: '+dt.USER_EMR+'</div></div></div>';
        
        
        
        
        $(elm).children( ".panel-body" ).html(dom);
        $(elm).data('loaded','1');

        setTimeout(function(){
            setResepRiwayat(dt.CPTDNO_TRANSAKSI_RJ);
        }, 1000);
        // getLoadDisplayRencanaTindakanCPPTPRW(dt.CPTDNO_TRANSAKSI);
    }


    function setResepRiwayat(noTrans){
        $.get('/emr/detail-entry-resep', {'q':'generateResepTXT','noTrans':noTrans,'times':new Date().getTime()}, 
            function(data) {
               if(data.success){
                    try{
                    $("#riwayat_farmasi_"+noTrans).html(''+(data.message).replace(/;/g, "<br/>"));
                    }catch(err){}
               }
        });
    
    }
    function renderContentCPTP(elm, data)
    {

        
        var dt = data[0];
        var dom = '';
        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> Waktu Pemeriksaan </b></div>'
        dom += '<div class="col-md-8">: '+dt.TTVUPDATED_ATS+'</div></div></div>';
        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> S </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTP_S+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> O </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTP_O+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> A </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTP_A+'</div></div></div>';
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> P </b></div>'
        dom += '<div class="col-md-8">: '+dt.CPTP_P+'</div></div></div>';
        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> TTV </b></div>'
        dom += '<div class="col-md-8"><span style="float:left;position:relative">:</span>'
        dom += '<div class="col-md-9" style="margin-left:5px;"><ul> '
        
            if(dt.TTVTSISTOL!=null)
                dom += '<li>Sistol : '+dt.TTVTSISTOL+' mmHg</li>';
            if(dt.TTVDIASTOL!=null)
                dom += '<li>Diastol : '+dt.TTVDIASTOL+' mmHg</li>';
            if(dt.TTVNADI!=null)
                dom += '<li>HR : '+dt.TTVNADI+' x/mnt</li>';
            if(dt.TTVNAFAS!=null)
                dom += '<li>RR : '+dt.TTVNAFAS+' x/mnt</li>';
            if(dt.TTVO2!=null)
                dom += '<li>SpO<sup>2</sup> : '+dt.TTVO2+' %</li>';
            if(dt.TTVSUHU!=null)
                dom += '<li>Suhu : '+dt.TTVSUHU+' °C</li>';
            if(dt.TTVTINGGI_BADAN!=null)
                dom += '<li>TB : '+dt.TTVTINGGI_BADAN+' cm</li>';
            if(dt.TTVBERAT_BADAN!=null)
                dom += '<li>BB : '+dt.TTVBERAT_BADAN+' kg</li>';
        
        dom += '</ul></div>';
        dom += '</div></div></div>';
        
     
        
        dom += '<div class="col-md-12"><div class="row"><div class="col-md-4"><b> Petugas </b></div>';

        
        dom += '<div class="col-md-8">: '+dt.USER_EMR+'</div></div></div>';

        
        
        
        $(elm).children( ".panel-body" ).html(dom);
        $(elm).data('loaded','1');
        // getLoadDisplayRencanaTindakanCPPTPRW(dt.CPTPNO_TRANSAKSI);
    }
