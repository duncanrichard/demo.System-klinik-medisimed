{% extends "layout/master.html" %}
{% block title %}
{{title}}
{% endblock %}

{% block head %}
<style>
    div#datagrid.dx-widget {
        font-size: 12px;
        line-height: 0.8;
        height: 240px;
    }
</style>

{% endblock %}
{% block content %}

<div class=''>
    <div class="modal-dialog modal-lg" role="modal" style="z-index: 4;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="ibox-title" style="background-color: #4f7ebb4f;">
                    <h3 style="text-align: center">{{title}}</h3>
                </div>
            </div>

            <div class="modal-body">
                <div class="card" style="overflow-x: visible;">
                    <div class="card-body">
                        <div class="row">
                            <label class="col-md-3 control-label" id="label_Cetak_mutasi_tanggal_dr" >TANGGAL KADALUARSA : </label>
                            <div class="col-md-3">
                                <input type="date" id="tanggal_dr"
                                    class="form-control input-sm-lab today formdate2">
                            </div>
                            
                        </div>
                        <div class="row">
                            <div style="overflow-y: auto;">
                                <div id="datagrid"></div>
                            </div>
                            <div class="options">
                                <div class="caption">Options</div>
                                <div class="option">            
                                    <div id="autoExpand"></div>
                                </div>    
                            </div>

                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="Prosescetak">Proses</button>
                <button type="button" class="btn btn-danger" id="Batalproses" data-dismiss="modal">Tutup</button>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% block script %}
{% load static %}

<script type="text/javascript">
{% include 'farmasi/printsales008/js/getDxGrid.html' %} 
{% include 'farmasi/printsales008/js/init.html' %}

</script>
{% endblock  %}
