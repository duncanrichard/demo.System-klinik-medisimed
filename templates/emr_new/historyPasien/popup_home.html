<!-- Modal  -->
<div class="modal fade" id="modalHistoryPasien" tabindex="-1" role="dialog" aria-labelledby="myModal">

    <div class="modal-dialog" role="document" style="width: 1200px;">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel">History Pasien</h4>
            </div>

            <div class="modal-body">

                <div style="margin: 0px 5px;">
                    <div class="row ">
                        <div class="col-sm-4 ">
                            {% include 'emrdokter/historyPasien/col_kiri.html' %}
                        </div>
                        <div class="col-sm-7 ">
                            {% include 'emrdokter/historyPasien/col_kanan.html' %}
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <!-- <button type="button" class="btn btn-default" data-dismiss="modal">Close</button> -->

            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="modalPasienPRB" tabindex="-1" role="dialog" aria-labelledby="myModal">

    <div class="modal-dialog" role="document" style="width: 1200px;">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel">Pasien PRB</h4>
            </div>

            <div class="modal-body">

                <div style="margin: 0px 5px;">
                
                    <div class="row" style="margin-left: 10px;">
                        <div class="col-md-2 ">
                            <label for="validationCustom01">Tanggal Mulai</label>
                            <input type="text" class="form-control datepik input-sm" id="tglAwalPasienPRB" required="">

                        </div>
                        <div class="col-md-2 ">
                            <label for="validationCustom02">Tanggal Akhir</label>
                            <input type="text" class="form-control datepik input-sm" id="tglAkhirPasienPRB" required="">

                        </div>


                        <div class="col-md-2 ">
                            <label for="validationCustom02">&nbsp;</label>
                            <button id="btnsetPasienPRB" type="button" class="btn btn-default input-sm" style="margin-top:15px" >Cari</button>

                        </div>
                    </div>

                    <div class="row" style="margin-left: 10px;">
                        <label class="col-sm-2 fz-11">Tampil Berdasarkan</label>
                        <div class="col-sm-5 form-inline">
                            <label class="radio-inline fz-11">
                                <input type="radio" name="sortByPasienPRB" value="1" checked="">PRB
                            </label>
                            <label class="radio-inline fz-11">
                                <input type="radio" name="sortByPasienPRB"  value="2">Restricted
                            </label>
                            <label class="radio-inline fz-11">
                                <input type="radio" name="sortByPasienPRB" value="3">PRB+Restricted
                            </label>

                        </div>
                    </div>

                    <div class="row ">
                        <div id="gridPasienPRB" style="overflow-x: scroll;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <!-- <button type="button" class="btn btn-default" data-dismiss="modal">Close</button> -->
                <button type="button" class="btn btn-primary" data-dismiss="modal">Batal</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPasienPassDokter" tabindex="-1" role="dialog" aria-labelledby="myModal">

    <div class="modal-dialog" role="document" style="width: 1200px;">
        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>

            <div class="modal-body">

                    </div>

                        <div class="col-md-2 ">
                            <label for="validationCustom02">&nbsp;</label>

                    </div>


                  
                </div>
            </div>

            <div class="modal-footer">

            </div>
        </div>
    </div>
</div>
