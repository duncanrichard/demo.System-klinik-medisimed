<div class="wrapper wrapper-content entry">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title" style="box-shadow: 10px 10px 5px 0 rgba(0, 0, 0, .75)">
                    <h3 style="text-align: center">poliklinik</h3>
                </div>
                <div class="panel-body"
                    style="background-color:#fafafa;border-radius: 5px;padding-bottom:10px;margin-top:5px;border-bottom: 1px solid #ddd">
                    <div class="form-row">
                        <div class="col-md-6  col-md-offset-1">
                            <div class="form-group row">
                                <label class="col-md-3 control-label">Kode poliklinik </label>
                                <div class="col-md-6">
                                    <input id="kode_poliklinik" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 control-label">Nama </label>
                                <div class="col-md-8">
                                    <input id="nama_poliklinik" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 control-label">Kode BPJS </label>
                                <div class="col-md-6"style="margin-top: 10px;">
                                    <input id="kode_klinik_bpjs" type="text" class="form-control input-sm">
                                </div>
                                {% comment %} <div class="col-md-3">
                                    <div class="row">
                                        <div class="btn btn-danger  btn-md active" id="btn_bridge_bpjs"
                                            style="font-size: 12px;height: 30px;margin-bottom: 10px;border-radius: 25px;margin-right: 10px;padding-bottom: 2rem;">
                                            <span class="fa fa-book"></span> Briding GET ID BPJS KE3SEHATAN
                                         </div>
                                    </div>
                                </div> {% endcomment %}
                            </div>
                            <div class="form-group row">
                                <label class="col-md-3 control-label">Kode Satu Sehat </label>
                                <div class="col-md-6"style="margin-top: 10px;">
                                    <input id="kode_klinik_satu_sehat" type="text" class="form-control input-sm">
                                </div>
                                <div class="col-md-3">
                                    <div class="row">
                                        <div class="btn btn-primary  btn-md active" id="btn_bridge_satu_sehat"
                                            style="font-size: 12px;height: 30px;margin-bottom: 10px;border-radius: 25px;margin-right: 10px;padding-bottom: 2rem;">
                                            <span class="fa fa-book"></span> Briding GET ID SATUSEHAT
                                         </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <!-- BUAT GRID -->
                    <div class="form-row" style="margin-top: 15px;">
                        <div class="col-md-12">
                            <div id="dxGridDatapoliklinik"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
