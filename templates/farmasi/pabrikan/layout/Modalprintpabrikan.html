<div class="modal fade" id="Modalprintpabrikan" tabindex="-1" role="dialog" aria-labelledby="myModal">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="DxGridLabelpabrikan">CETAK DATA PABRIKAN</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
            </div>

            <div class="modal-body">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 col-md-offset-2">
                            <input type="text" name="cetak_dari" id="cetak_dari"
                                class="form-control input-sm-lab grid-opt-pabrikan" placeholder="dari kode">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-sm btn-block btn-primary" onclick="caripabrikan(event, 1)">
                                <span class="fa fa-search"></span> Cari
                            </button>
                        </div>
                        <div class="col-md-3">
                            <input type="text" name="cetak_sampai" id="cetak_sampai"
                                class="form-control input-sm-lab grid-opt-pabrikan" placeholder="s/d kode">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-sm btn-block btn-primary" onclick="caripabrikan(event, 2)">
                                <span class="fa fa-search"></span> Cari
                            </button>
                        </div>
                    </div>
                    <br>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger"  onclick="cetakpabrikan(event)">Cetak</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Tutup</button>
            </div>
        </div>
    </div>
</div>
