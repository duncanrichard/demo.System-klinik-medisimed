function uploadImageVisual(fd) {
    $.ajax({
        url: '/emr/upload/',
        type: 'POST',
        data: fd,
        async: true,
        cache: false,
        contentType: false,
        enctype: 'multipart/form-data',
        processData: false,
        beforeSend: function() {
            console.log('Uploading...');
            $('.upload-progress').show();
        },
        success: function(response) {
            $('.upload-progress').hide();
            if (response.status == 200) {
                console.log(response);
                alert("Sukses Upload");
            } else {
                try {
                    var error = JSON.parse(response.error);
                    alert('Vailed to upload! ' + error['data']['error'] + ', error_code: ' + error['status']);
                } catch (error) {
                    alert('Vailed to upload! ' + response.error + ', error_code :' + response.status);
                }
                console.log(response);
            }
        },
        error: function(response) {
            console.log("error", response);
            alert(response);
        }
    });
}

function dataURLtoBlob(dataURL) {
    // Decode the dataURL    
    var binary = atob(dataURL.split(',')[1]);
    // Create 8-bit unsigned array
    var array = [];
    for (var i = 0; i < binary.length; i++) {
        array.push(binary.charCodeAt(i));
    }
    // Return our Blob object
    return new Blob([new Uint8Array(array)], { type: 'image/png' });
}


function readURL(input, tujuan) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();

        reader.onload = function(e) {
            $(tujuan).attr('src', e.target.result);
        }

        reader.readAsDataURL(input.files[0]);
    }
}

    function loadpicker(kond){

    function loadGridPickerBPJS(url,url2=null){
        $("#modalPickerFaskes").dxDataGrid({
                showColumnLines: false,
                showRowLines: true,
                rowAlternationEnabled: true,
                showBorders: true,
                paging: {
                    pageSize: 5
                },
                filterRow: { visible: false },
                dataSource: url2+url,
                selection: {
                mode: "single"
                },
                hoverStateEnabled: true,
                // columns: [{"kdPoliklinik", "namapasien", "alamat", "telepon"}]
                columns: [ 
                    {dataField: "kdppk", width: 50,caption: "NO"},
                    {dataField: "nmppk", width: 200,caption: "FASKES"},
                    {dataField: "kelas", width: 100,caption: "KELAS"},
                    {caption: "JARAK", width:100,calculateCellValue: function (rowData) {
                        return (rowData.distance/1000).toFixed(2)+" KM";
                    }
                    },
                    {dataField: "jmlRujuk", width: 100,caption: "TOT.RUJUKAN"},
                    {dataField: "kapasitas", width: 100,caption: "KAPASITAS"},
                    {dataField: "persentase", width: 50,caption: "(%)"},
                   /* {caption: "(%)",calculateCellValue: function (rowData) {
                        return rowData.persentase + "% ";
                    }},*/
                    {dataField: "jadwal", width: 300,caption: "JADWAL"},
                    {dataField: "nmkc", width: 100,caption: "KANTOR CBG"},
                    {dataField: "alamatPpk", width: 300,caption: "ALAMAT"},
                    {dataField: "telpPpk", width:200,caption: "TELP"},
                    
                    ],
                onSelectionChanged: function (selectedItems) {
                    var data = selectedItems.selectedRowsData[0];
                    selectionChangedRaised = true;
                },
                onRowClick : function(e) {
                if (!selectionChangedRaised) {
                    var dataGrid = e.component;
                    var keys = dataGrid.getSelectedRowKeys();
                    dataGrid.deselectRows(keys);
                }
                selectionChangedRaised = false;

                    var data = e.data;
                    try{if($("textarea#catatanRujuk_txt").val().length>0){
                        $('#catatanRujukan').val($("#catatanRujuk_txt").val());
                    }
                    }catch(err) {}
                    try{$('#jenisRujukan_rbs').val(""+$("input[name='jenisRujukan_rb']:checked").val());}catch(err) {}
                    try{$('#opsiRujuk_rbs').val(""+$("input[name='opsiRujuk_rb']:checked").val());}catch(err) {}
                    try{$('#kondisiKhususKategoris').val(""+$("select[name='kondisiKhususKategori'] option:selected").val());}catch(err) {}
                    try{$('#rujukanSarana').val(kdSaranaV);}catch(err) {}
                    try{$('#ppkRujukan').val(''+data.kdppk);}catch(err) {}
                    try{$('#ppkRujukanN').val(''+data.nmppk);}catch(err) {}
                    try{$('#ppkRujukanN').val(''+data.nmppk);}catch(err) {}
                    try{$('#spesialisRujukan').val(''+$("select[name='spesialis2'] option:selected").val());}catch(err) {}
                    try{$('#spesialisRujukanN').val(''+$("select[name='spesialis2'] option:selected").text());}catch(err) {}
                    try{$('#modalPickerPencarianFaskesRujukan').modal('hide');}catch(err) {}
                }
            });
    }

    function getMinggu(mulai){
        var minggu =0;
        try{
        //var date1 = new Date("06/30/2019"); 
        //var date2 = new Date("07/30/2019"); 
        var sampai = moment().format('MM/D/YYYY');
        var mulais = mulai.split("-");
        var mulai= mulais[1]+'/'+mulais[2]+'/'+mulais[0];
        var date1 = new Date(mulai); 
        var date2 = new Date(sampai); 
        

        // To calculate the time difference of two dates 
        var Difference_In_Time = date2.getTime() - date1.getTime(); 
        
        // To calculate the no. of days between two dates 
        var Difference_In_Days = Difference_In_Time / (1000 * 3600 * 24); 

         minggu=Difference_In_Days/7;
        }catch(err){
        }
        $('#TTV_UH').val(''+minggu.toFixed(0));
    }

    function getAge(dateString) {
        var now = new Date();
        var today = new Date(now.getYear(),now.getMonth(),now.getDate());

        var yearNow = now.getYear();
        var monthNow = now.getMonth();
        var dateNow = now.getDate();

        var dob = new Date(dateString.substring(6,10),
                            dateString.substring(0,2)-1,                   
                            dateString.substring(3,5)                  
                            );

        var yearDob = dob.getYear();
        var monthDob = dob.getMonth();
        var dateDob = dob.getDate();
        var age = {};
        var ageString = "";
        var yearString = "";
        var monthString = "";
        var dayString = "";


        yearAge = yearNow - yearDob;

        if (monthNow >= monthDob)
            var monthAge = monthNow - monthDob;
        else {
            yearAge--;
            var monthAge = 12 + monthNow -monthDob;
        }

        if (dateNow >= dateDob)
            var dateAge = dateNow - dateDob;
        else {
            monthAge--;
            var dateAge = 31 + dateNow - dateDob;

            if (monthAge < 0) {
            monthAge = 11;
            yearAge--;
            }
        }

        age = {
            years: yearAge,
            months: monthAge,
            days: dateAge
            };

        if ( age.years > 1 ) yearString = " years";
        else yearString = " year";
        if ( age.months> 1 ) monthString = " months";
        else monthString = " month";
        if ( age.days > 1 ) dayString = " days";
        else dayString = " day";


        $('#thn').val(''+age.years);
        $('#bln').val(''+age.months);
        $('#hari').val(''+age.days);
        setKelompok(age.years,age.months);
        return ageString;
    }
