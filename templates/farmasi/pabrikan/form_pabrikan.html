<div class="wrapper wrapper-content entry">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title" style="box-shadow: 10px 10px 5px 0 rgba(0, 0, 0, .75)">
                    <h3 style="text-align: center">PABRIKAN</h3>
                </div>
                <div class="panel-body"
                    style="background-color:#fafafa;border-radius: 5px;padding-bottom:10px;margin-top:5px;border-bottom: 1px solid #ddd">
                    <div class="form-row">
                        <div class="col-md-6  col-md-offset-1">
                            <div class="form-group row">
                                <label class="col-md-2 control-label">Kode pabrikan </label>
                                <div class="col-md-2">
                                    <input id="kode_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-2 control-label">Nama </label>
                                <div class="col-md-8">
                                    <input id="nama_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-2 control-label">Alamat </label>
                                <div class="col-md-10">
                                    <input id="alamat_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="fform-group row">
                                <label class="col-md-2 control-label">Kota </label>
                                <div class="col-md-6">
                                    <input id="kota_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-2 control-label">Kode Pos </label>
                                <div class="col-md-2">
                                    <input id="kodepos_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-2 control-label">Telepon </label>
                                <div class="col-md-5">
                                    <input id="telepon_pabrikan" type="text" class="form-control input-sm">
                                </div>
                                <label class="col-md-2 control-label">Fax </label>
                                <div class="col-md-3">
                                    <input id="fax_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-md-2 control-label">Contact </label>
                                <div class="col-md-4">
                                    <input id="contact_pabrikan" type="text" class="form-control input-sm">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- BUAT GRID -->
                    <div class="form-row" style="margin-top: 15px;">
                        <div class="col-md-12">
                            <div id="dxGridDatapabrikan"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
