    $('input').on("keypress", function(e) {
            /* ENTER PRESSED*/
            if (e.keyCode == 13) {
                /* FOCUS ELEMENT */
                var inputs = $(this).parents("form").eq(0).find(":input");
                var idx = inputs.index(this);

                if (idx == inputs.length - 1) {
                    inputs[0].select()
                } else {
                    inputs[idx + 1].focus(); //  handles submit buttons
                    inputs[idx + 1].select();
                }
                return false;
            }

    function convertResep(){
        var sigmaawal='S.';
        var sigma1=$('#frkw1').val();
        var sigma2=$('#frkw2').val();
        var sigma3=$('#crapakai1').val();
        var sigma4=$('#signas').val();
        var sigma5=$('#signaf').val();

        var dataSigma=$('#sigma').val(''+sigmaawal+' '+sigma1+' '+sigma5+' '+sigma2+'  '+sigma4+'  '+sigma3);
        
    }

    var numeralCodes = [["","I","II","III","IV","V","VI","VII","VIII","IX"],         // Ones
                    ["","X","XX","XXX", "XL", "L", "LX", "LXX", "LXXX", "XC"],   // Tens
                    ["","C","CC","CCC","CD","D","DC","DCC","DCCC","CM"]];        // Hundreds

    function convert(num) {
        var numeral = "";
        var digits = num.toString().split('').reverse();
        for (var i=0; i < digits.length; i++){
            numeral = numeralCodes[i][parseInt(digits[i])] + numeral;
        }
        return numeral;  
    }

        if(data.trim().length > 1) {
         // Enable submit button
            hasil=data.split('-').reverse().join('-');
        }

        return hasil;
    }

    function getAge(dateString) {
        var now = new Date();
        var today = new Date(now.getYear(),now.getMonth(),now.getDate());

        var yearNow = now.getYear();
        var monthNow = now.getMonth();
        var dateNow = now.getDate();

        var dob = new Date(dateString.substring(6,10),
                            dateString.substring(0,2)-1,                   
                            dateString.substring(3,5)                  
                            );

        var yearDob = dob.getYear();
        var monthDob = dob.getMonth();
        var dateDob = dob.getDate();
        var age = {};
        var ageString = "";
        var yearString = "";
        var monthString = "";
        var dayString = "";


        yearAge = yearNow - yearDob;

        if (monthNow >= monthDob)
            var monthAge = monthNow - monthDob;
        else {
            yearAge--;
            var monthAge = 12 + monthNow -monthDob;
        }

        if (dateNow >= dateDob)
            var dateAge = dateNow - dateDob;
        else {
            monthAge--;
            var dateAge = 31 + dateNow - dateDob;

            if (monthAge < 0) {
            monthAge = 11;
            yearAge--;
            }
        }

        age = {
            years: yearAge,
            months: monthAge,
            days: dateAge
            };

        if ( age.years > 1 ) yearString = " years";
        else yearString = " year";
        if ( age.months> 1 ) monthString = " months";
        else monthString = " month";
        if ( age.days > 1 ) dayString = " days";
        else dayString = " day";


        $('#thn').val(''+age.years);
        $('#bln').val(''+age.months);
        $('#hari').val(''+age.days);
        return ageString;
    }

    function setGridTampilHistoryLama(kdPasien){
        $("#gridHistoryResepManual").dxDataGrid({
        showColumnLines: false,
        showRowLines: true,
        rowAlternationEnabled: true,
        showBorders: true,
        paging: {
            pageSize: 1000
        },
        scrolling: {
            columnRenderingMode: "virtual"
        },
        filterRow: { visible: true },
        dataSource: "/emr/eresep/pickerHistoryResepManual?kdPasien="+kdPasien+ "&times=" + new Date().getTime(),
        selection: {
        mode: "single"
        },
        hoverStateEnabled: true,
        columns: [ 
        {dataField: "FMDDOKTERN",caption: "Dokter"},
        {dataField: "TGL",caption: "tanggal"},
        {dataField: "FHRRESEPTEXT",caption: "Resep"},

        ]
        /*,onSelectionChanged: function (selectedItems) {
            var data = selectedItems.selectedRowsData[0];
            
            
            
            selectionChangedRaised = true;
            
        }*/,
        onRowClick : function(e) {
        if (!selectionChangedRaised) {
            var dataGrid = e.component;
            var keys = dataGrid.getSelectedRowKeys();
            dataGrid.deselectRows(keys);
        }
        var data=e.data;
        $('#FHRRESEPTEXT').val(''+data.FHRRESEPTEXT.replace(/[<]br[^>]*[>]/gi, ""));
        selectionChangedRaised = false;
        }
    });
    }
